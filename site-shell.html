<!-- =========================================================================
     قشرة الموقع — مشتركةٌ بين كلّ صفحات supervisor-mct.com ونطاقاتها الفرعيّة
     (نظام التقارير، التقرير الشهري، خطة السير، بيانات المعلّمين واستمارتهم).

     تحمل ثلاثة أشياء: شريط الهويّة، ومشهد الطابور خلفيّةً، والزجاج.

     المشهد هو مشهد البوّابة نفسه — السماء والشمس والأرض والصفوف —
     لكن بدرجاتِ ما بعد الشروق لا الفجر: نصوص هذه الصفحات داكنة، وهي
     استماراتٌ تُقرأ وتُطبع، فلو نُقل الفجر الداكن كما هو لانطمس النصّ.
     وبهذا يظهر الزجاج فعلاً: لوحٌ شفّافٌ فوق مشهدٍ لا فوق بياضٍ مسطّح.

     هذا الملفّ هو المصدر. عند تعديله يُنسخ كما هو إلى أوّل <body> في:
       • supervisory-visit-report/reports.html · monthly.html
       • plan-mct/index.html
       • teacher-data-collection/index.html · data.html

     ولا يُربط من الشبكة: النطاقات مختلفة، ونظام التقارير يعمل دون إنترنت.
     ويختفي كلّه عند الطباعة.
     ========================================================================= -->
<style>
:root{
  --svf-dark:#0a1410; --svf-ink:#f7f5ee; --svf-gold:#f0b44a;
  --svf-day-1:#eaeef5; --svf-day-2:#f3ece6; --svf-day-3:#fae3d2; --svf-day-4:#f6d9c6;
  --svf-sun:rgba(255,214,150,.5); --svf-sun-2:rgba(255,226,186,.22);
  --svf-soil-1:#e9e2d9; --svf-soil-2:#ddd3c7;
  --svf-rank:#b3a79d;
  --svf-glass:rgba(255,255,255,.76);
  --svf-glass-line:rgba(255,255,255,.85);
  --svf-sheen:rgba(255,255,255,.35);
}
html{background:var(--svf-day-1)}
body{background:transparent !important}

/* ── المشهد: ثابتٌ خلف كلّ شيء ── */
.svf-scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.svf-scene span,.svf-scene svg{position:absolute;display:block}
.svf-sky{inset:0;background:linear-gradient(180deg,
  var(--svf-day-1) 0%,var(--svf-day-2) 38%,var(--svf-day-3) 74%,var(--svf-day-4) 100%)}
.svf-sun{inset-inline-start:20%;inset-block-start:52%;width:min(30vw,300px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--svf-sun) 0%,var(--svf-sun-2) 45%,transparent 70%);
  animation:svfRise 48s ease-in-out infinite alternate}
.svf-ground{inset-inline:0;inset-block-start:84%;bottom:0;
  background:linear-gradient(180deg,var(--svf-soil-1) 0%,var(--svf-soil-2) 100%)}
.svf-ranks{inset-inline:-4%;bottom:0;width:108%;height:26%;
  animation:svfDrift 26s ease-in-out infinite alternate}
.svf-ranks g{fill:var(--svf-rank)}
.svf-ranks .far{opacity:.2}
.svf-ranks .near{opacity:.28}
.svf-sheen{inset:-25%;
  background:linear-gradient(115deg,transparent 42%,var(--svf-sheen) 48%,rgba(255,255,255,.08) 53%,transparent 62%);
  animation:svfSheen 22s ease-in-out infinite}
@keyframes svfRise{from{transform:translateY(5%) scale(.97)}to{transform:translateY(-8%) scale(1.03)}}
@keyframes svfDrift{from{transform:translate3d(0,0,0) scale(1.01)}to{transform:translate3d(-2%,0,0) scale(1.04)}}
@keyframes svfSheen{0%{transform:translateX(-38%)}55%{transform:translateX(38%)}100%{transform:translateX(-38%)}}

/* ── الزجاج: أسطح الصفحات تصير ألواحاً فوق المشهد ── */
.bg-white,.svf-glass{
  background-color:var(--svf-glass) !important;
  -webkit-backdrop-filter:blur(14px) saturate(1.1);
  box-shadow:inset 0 1px 0 var(--svf-glass-line)}
@supports (backdrop-filter: blur(4px)){
  .bg-white,.svf-glass{backdrop-filter:blur(14px) saturate(1.1)}
}
/* لوح النافذة المنبثقة يبقى مصمتاً: تحته ستارةٌ داكنة، والشفافيّة تُذهب قراءته */
.fixed.inset-0 .bg-white,.modal-overlay .bg-white{
  background-color:#fff !important;-webkit-backdrop-filter:none;backdrop-filter:none}

/* ── شريط الهويّة ── */
.svf-id{background:var(--svf-dark);color:var(--svf-ink);
  font-family:'IBM Plex Sans Arabic','Tajawal',system-ui,sans-serif;
  display:flex;align-items:center;gap:14px;padding:10px 24px;
  font-size:13px;line-height:1.45;direction:rtl;position:relative;z-index:1}
.svf-id b{font-weight:600;font-size:14.5px;letter-spacing:-.2px}
.svf-id i{font-style:normal;opacity:.6}
.svf-id a{margin-inline-start:auto;color:inherit;text-decoration:none;
  border:1px solid rgba(247,245,238,.3);border-radius:999px;padding:5px 15px;
  white-space:nowrap;transition:background-color .2s ease,border-color .2s ease}
.svf-id a:hover{background:rgba(247,245,238,.12);border-color:rgba(247,245,238,.5)}
.svf-id a:active{background:rgba(247,245,238,.06)}
.svf-id a:focus-visible{outline:2px solid var(--svf-gold);outline-offset:2px}

@media (max-width:560px){ .svf-id{padding:9px 16px;gap:10px} .svf-id i{display:none} }
@media (prefers-reduced-motion:reduce){ .svf-scene *{animation:none !important} }
@media print{
  .svf-scene,.svf-id{display:none !important}
  html{background:#fff}
  .bg-white,.svf-glass{background-color:#fff !important;backdrop-filter:none;box-shadow:none}
}
</style>
